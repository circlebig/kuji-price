name: 시세 갱신 및 배포

on:
  schedule:
    # 매시간 23분. GitHub 예약 실행은 늦어지거나 건너뛰는 일이 잦아서 자주 걸어 둔다.
    # 빠른 수집은 2분 안팎이고, 전체 수집은 하루 한 번만 한다(run.py auto 가 판단).
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "전체 수집 (카탈로그 포함, 약 20분)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["kujiprice/**", "run.py", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUTF8: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      # 수집 DB는 저장소에 넣지 않고 Actions 캐시로 다음 실행에 넘긴다
      - name: 이전 수집 DB 복원
        id: db
        uses: actions/cache/restore@v6
        with:
          path: data/kuji.sqlite
          key: kuji-db-${{ github.run_id }}
          restore-keys: kuji-db-

      - name: 수집 및 집계
        # 수동 실행에서 전체 수집을 골랐으면 all, 아니면 오늘 전체 수집을 했는지 보고 스스로 정한다
        run: python run.py ${{ inputs.full && 'all' || 'auto' }}

      - name: 결과 점검
        run: |
          # 수집이 막혀 빈 페이지가 배포되는 것을 막는다
          python - <<'PY'
          import json, sys
          d = json.load(open("data/data.json", encoding="utf-8"))
          jp = sum(1 for p in d["prizes"] if p["jp"])
          kr = sum(1 for p in d["prizes"] if p["kr"])
          print(f"일본 시세 {jp}종, 한국 시세 {kr}종 / 전체 {len(d['prizes'])}종")
          if jp < 20 or kr < 20:
              sys.exit("시세가 잡힌 상품이 너무 적습니다. 수집이 막혔을 수 있어 배포하지 않습니다.")
          PY

      - name: 수집 DB 저장
        if: always() && hashFiles('data/kuji.sqlite') != ''
        uses: actions/cache/save@v6
        with:
          path: data/kuji.sqlite
          key: kuji-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # 올린 결과물이 조회되기 전에 배포가 시작되어 실패하는 일이 있어 별도 작업으로 나눈다
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
